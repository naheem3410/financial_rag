# C0 — Naive RAG. Outside the 2x2 factorial: fixed-size chunking, dense-only,
# no rerank. A reference point, not the baseline — do not conflate with C1.
experiment_id: c0_naive
enable_npce: false
enable_cove: false
retrieval:
  mode: naive_dense
  top_k: 20
  rerank_top_k: 5
  enable_reranker: false
  time_weighting: false
indexing:
  granularity: fixed_size
llm:
  defaults:
    temperature: 0.0
    structured_output: true
  call_sites:
    proposition_segmenter:
      provider: openai
      model: "gpt-4.1-mini-2025-04-14"  # pinned snapshot, not the floating "gpt-4.1-mini" alias
      concurrency: 16
      include_reasoning_field: false  # mechanical instruction-following, not reasoning -- pure cost otherwise
    proposition_segmenter_escalation:
      provider: openai
      model: "gpt-5.6-luna"  # see config/experiments/c1_baseline.yaml for the full rationale
    numeric_qualifier_resolver:
      provider: openai
      model: "<pinned-version>"
    query_splitter:
      provider: openai
      model: "<pinned-version>"
    fff_rewriter:
      provider: openai
      model: "<pinned-version>"
    generator:
      provider: openai
      model: "gpt-4.1-mini-2025-04-14"  # matches C1-C4's generator model (used via
      # schema_key="naive_generator", online/output/naive_generator.py) so the naive baseline isn't
      # confounded by a different model choice from the real system it's being compared against.
    cove_verification:
      provider: anthropic
      model: "<pinned-version>"
  providers:
    openai:
      api_key_env: OPENAI_API_KEY
      rpm: 500
      rpd: 10000
      tpm: 200000
    anthropic:
      api_key_env: ANTHROPIC_API_KEY
    ollama:
      base_url: "http://localhost:11434"
      seed: 42
embedding:
  model: "BAAI/bge-base-en-v1.5"
  revision: "a5beb1e3e68b9ab74eb54cfd186867f64f240e1a"
  dimension: 768
corpus:
  pdf_dir: "data/pdfs"
  required_docs_file: "data/required_docs.txt"
guards:
  numeric_verbatim: true
  deterministic_numeric_comparison: true
