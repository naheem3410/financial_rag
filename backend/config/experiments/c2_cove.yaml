# C2 — Baseline + CoVe. Identical retrieval core to C1; only enable_cove differs.
experiment_id: c2_cove
enable_npce: false
enable_cove: true
retrieval:
  mode: hybrid
  top_k: 20
  rerank_top_k: 10  # adopted for all cells -- see config/experiments/c1_baseline.yaml for the real-run evidence
  enable_reranker: true
  time_weighting: true
indexing:
  granularity: proposition
llm:
  defaults:
    temperature: 0.0
    structured_output: true
  call_sites:
    proposition_segmenter:
      provider: openai
      model: "gpt-4.1-mini-2025-04-14"  # pinned snapshot, not the floating "gpt-4.1-mini" alias
      concurrency: 16
      include_reasoning_field: false  # mechanical instruction-following, not reasoning -- pure cost otherwise
    proposition_segmenter_escalation:
      provider: openai
      model: "gpt-5.6-luna"  # no dated snapshot variant is exposed for this model, so this
      # floating identifier is the most pinned form available. Escalation fallback for a batch
      # that fails the table-row completeness check only.
    numeric_qualifier_resolver:
      provider: openai
      model: "<pinned-version>"
    query_splitter:
      provider: openai
      model: "<pinned-version>"
    step_planner:
      provider: openai
      model: "<pinned-version>"  # step 4.6 -- irrelevant here since enable_npce is false in C2
      # (no router), kept in sync for schema validity like query_splitter above
    fff_rewriter:
      provider: openai
      model: "gpt-4.1-mini-2025-04-14"  # kept identical to C1 -- only the CoVe call sites use a
      # different model
    generator:
      provider: openai
      model: "gpt-4.1-mini-2025-04-14"  # kept identical to C1 (see fff_rewriter comment)
    cove_verification:
      provider: openai
      model: "gpt-4.1-mini-2025-04-14"  # gpt-5.6-luna forces temperature=1 (a reasoning model
      # that rejects temperature=0 outright), which was root-caused as the source of CoVe verdict
      # instability on identical evidence: the resulting phrasing drift in independent
      # verification's period_label ("December 31, 2018" vs "the quarter ended December 31, 2018"
      # for the same annual fact) tripped parse_fiscal_period's deliberate "never guess a quarter"
      # guard, falling back to raw string equality and producing a false conflict verdict,
      # discarding an otherwise-correct claim under the abstention gate's all-or-nothing rule.
      # gpt-4.1-mini runs at genuine temperature=0, same as every other call site.
  providers:
    openai:
      api_key_env: OPENAI_API_KEY
      rpm: 500
      rpd: 10000
      tpm: 200000
    anthropic:
      api_key_env: ANTHROPIC_API_KEY
    ollama:
      base_url: "http://localhost:11434"
      seed: 42
embedding:
  model: "BAAI/bge-base-en-v1.5"
  revision: "a5beb1e3e68b9ab74eb54cfd186867f64f240e1a"
  dimension: 768
corpus:
  pdf_dir: "data/pdfs"
  required_docs_file: "data/required_docs.txt"
guards:
  numeric_verbatim: true
  deterministic_numeric_comparison: true
