# C3 — Baseline + NPCE. Identical retrieval core to C1; only enable_npce differs.
experiment_id: c3_npce
enable_npce: true
enable_cove: false
retrieval:
  mode: hybrid
  top_k: 20
  rerank_top_k: 10  # adopted for all cells -- see config/experiments/c1_baseline.yaml for the real-run evidence
  enable_reranker: true
  time_weighting: true
indexing:
  granularity: proposition
llm:
  defaults:
    temperature: 0.0
    structured_output: true
  call_sites:
    proposition_segmenter:
      provider: openai
      model: "gpt-4.1-mini-2025-04-14"  # pinned snapshot, not the floating "gpt-4.1-mini" alias
      concurrency: 16
      include_reasoning_field: false  # mechanical instruction-following, not reasoning -- pure cost otherwise
    proposition_segmenter_escalation:
      provider: openai
      model: "gpt-5.6-luna"  # see config/experiments/c1_baseline.yaml for the full rationale
    numeric_qualifier_resolver:
      provider: openai
      model: "<pinned-version>"
    query_splitter:
      provider: openai
      model: "gpt-4.1-mini-2025-04-14"  # same model as fff_rewriter/generator/proposition_segmenter:
      # the split task (parse a financial question into structured slots) is comparably mechanical,
      # not deep reasoning, and using the same model already in use everywhere else avoids
      # introducing an unexplained new model variable into the C1-vs-C3 comparison.
    step_planner:
      provider: openai
      model: "gpt-4.1-mini-2025-04-14"  # step 4.6 -- same model as query_splitter/fff_rewriter/
      # generator, for the same reason: the router is on here, so this call site is genuinely
      # reachable in C3, and matching everything else avoids an unexplained model variable.
    fff_rewriter:
      provider: openai
      model: "gpt-4.1-mini-2025-04-14"  # matches C1/C2 for a fair comparison
    generator:
      provider: openai
      model: "gpt-4.1-mini-2025-04-14"  # matches C1/C2 for a fair comparison
    cove_verification:
      provider: openai
      model: "gpt-4.1-mini-2025-04-14"  # gpt-5.6-luna forces temperature=1 (a reasoning model that
      # rejects temperature=0) and was root-caused as the source of CoVe verdict instability on
      # identical evidence. gpt-4.1-mini runs at genuine temperature=0, same as every other call
      # site. Irrelevant here since enable_cove is false in C3, kept in sync for consistency.
  providers:
    openai:
      api_key_env: OPENAI_API_KEY
      rpm: 500
      rpd: 10000
      tpm: 200000
    anthropic:
      api_key_env: ANTHROPIC_API_KEY
    ollama:
      base_url: "http://localhost:11434"
      seed: 42
embedding:
  model: "BAAI/bge-base-en-v1.5"
  revision: "a5beb1e3e68b9ab74eb54cfd186867f64f240e1a"
  dimension: 768
corpus:
  pdf_dir: "data/pdfs"
  required_docs_file: "data/required_docs.txt"
guards:
  numeric_verbatim: true
  deterministic_numeric_comparison: true
