# C4 — Full framework. Identical retrieval core to C1-C3; both NPCE and
# CoVe enabled.
experiment_id: c4_full
enable_npce: true
enable_cove: true
retrieval:
  mode: hybrid
  top_k: 20
  rerank_top_k: 10  # adopted for all cells -- see config/experiments/c1_baseline.yaml for the real-run evidence
  enable_reranker: true
  time_weighting: true
indexing:
  granularity: proposition
llm:
  defaults:
    temperature: 0.0
    structured_output: true
  call_sites:
    proposition_segmenter:
      provider: openai
      model: "gpt-4.1-mini-2025-04-14"  # pinned snapshot, not the floating "gpt-4.1-mini" alias
      concurrency: 16
      include_reasoning_field: false  # mechanical instruction-following, not reasoning -- pure cost otherwise
    proposition_segmenter_escalation:
      provider: openai
      model: "gpt-5.6-luna"  # see config/experiments/c1_baseline.yaml for the full rationale
    numeric_qualifier_resolver:
      provider: openai
      model: "<pinned-version>"
    query_splitter:
      provider: openai
      model: "gpt-4.1-mini-2025-04-14"  # matches C3 for a fair comparison
    step_planner:
      provider: openai
      model: "gpt-4.1-mini-2025-04-14"  # step 4.6 -- matches C3 (the router is on here too), same
      # reasoning as query_splitter above
    fff_rewriter:
      provider: openai
      model: "gpt-4.1-mini-2025-04-14"  # matches C1/C2/C3
    generator:
      provider: openai
      model: "gpt-4.1-mini-2025-04-14"  # matches C1/C2/C3
    cove_verification:
      provider: openai
      model: "gpt-4.1-mini-2025-04-14"  # gpt-5.6-luna forces temperature=1 (a reasoning model
      # that rejects temperature=0 outright) and was root-caused as the source of CoVe verdict
      # instability on identical evidence (see config/experiments/c2_cove.yaml for the full
      # mechanism). Matches C2's model choice so any C2-vs-C4 comparison isn't confounded by a
      # model-choice difference on top of the real NPCE+CoVe interaction being measured.
  providers:
    openai:
      api_key_env: OPENAI_API_KEY
      rpm: 500
      rpd: 10000
      tpm: 200000
    anthropic:
      api_key_env: ANTHROPIC_API_KEY
    ollama:
      base_url: "http://localhost:11434"
      seed: 42
embedding:
  model: "BAAI/bge-base-en-v1.5"
  revision: "a5beb1e3e68b9ab74eb54cfd186867f64f240e1a"
  dimension: 768
corpus:
  pdf_dir: "data/pdfs"
  required_docs_file: "data/required_docs.txt"
guards:
  numeric_verbatim: true
  deterministic_numeric_comparison: true
