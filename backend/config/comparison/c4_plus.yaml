# C4+ (step 5.2, decision 8 and decision 12, owner's "C4+" name pinned down
# 2026-11-16): the exact same C4 pipeline as config/experiments/c4_full.yaml,
# with the one approved-but-not-yet-switched-on piece turned on --
# retrieval.enable_metric_filter: true. This is "the full framework with
# every approved decision switched on", the setup the results chapter
# actually compares against plain AI and naive RAG (C0). Not one of the
# five C0-C4 cells, so this lives in config/comparison/, not
# config/experiments/ -- same reasoning as config/baselines/plain_ai_baseline.yaml,
# so test_config_schema.py's "exactly five experiment yamls" check stays untouched.
experiment_id: c4_plus
enable_npce: true
enable_cove: true
retrieval:
  mode: hybrid
  top_k: 20
  rerank_top_k: 10  # adopted for all cells -- see config/experiments/c1_baseline.yaml for the real-run evidence
  enable_reranker: true
  time_weighting: true
  enable_metric_filter: true  # decision 12, off everywhere else -- this is the only field that differs from c4_full.yaml
  enable_ondemand_metric_labeling: true  # decision 25/26, off everywhere else -- labels an unlabelled
  # reranked candidate on the spot for a real sub-query, instead of a blanket backfill (decision 26
  # moved the hook from the raw metric-filter pool to the reranked candidates -- see pipeline_c4.py)
  rerank_tie_break_logit_margin: 3.0  # decision 40 option 1, paid-tested only combined with the guard below
  enable_ask_match_guard: true  # decision 40 option 4 -- cancels option 1's one regression
  near_identical_logit_margin: 3.0  # decision 40 option 4, same margin as the tie-break above
indexing:
  granularity: proposition
llm:
  defaults:
    temperature: 0.0
    structured_output: true
  call_sites:
    proposition_segmenter:
      provider: openai
      model: "gpt-4.1-mini-2025-04-14"  # pinned snapshot, not the floating "gpt-4.1-mini" alias
      concurrency: 16
      include_reasoning_field: false  # mechanical instruction-following, not reasoning -- pure cost otherwise
    proposition_segmenter_escalation:
      provider: openai
      model: "gpt-5.6-luna"  # see config/experiments/c1_baseline.yaml for the full rationale
    numeric_qualifier_resolver:
      provider: openai
      model: "<pinned-version>"
    query_splitter:
      provider: openai
      model: "gpt-4.1-mini-2025-04-14"  # matches C3/C4 for a fair comparison
    step_planner:
      provider: openai
      model: "gpt-4.1-mini-2025-04-14"  # step 4.6 -- matches C3/C4 (the router is on here too), same
      # reasoning as query_splitter above
    metric_label_fallback:
      provider: openai
      model: "gpt-4.1-mini-2025-04-14"  # decision 25 -- same model as every other call site here,
      # only fires for a candidate the free rule-based labeler found nothing at all for
    fff_rewriter:
      provider: openai
      model: "gpt-4.1-mini-2025-04-14"  # matches C1/C2/C3/C4
    generator:
      provider: openai
      model: "gpt-4.1-mini-2025-04-14"  # matches C1/C2/C3/C4
    cove_verification:
      provider: openai
      model: "gpt-4.1-mini-2025-04-14"  # gpt-5.6-luna forces temperature=1 (a reasoning model
      # that rejects temperature=0 outright) and was root-caused as the source of CoVe verdict
      # instability on identical evidence (see config/experiments/c2_cove.yaml for the full
      # mechanism). Matches C4's model choice so any comparison isn't confounded by a
      # model-choice difference on top of the real metric-filter effect being measured.
  providers:
    openai:
      api_key_env: OPENAI_API_KEY
      rpm: 500
      rpd: 10000
      tpm: 200000
    anthropic:
      api_key_env: ANTHROPIC_API_KEY
    ollama:
      base_url: "http://localhost:11434"
      seed: 42
embedding:
  model: "BAAI/bge-base-en-v1.5"
  revision: "a5beb1e3e68b9ab74eb54cfd186867f64f240e1a"
  dimension: 768
corpus:
  pdf_dir: "data/pdfs"
  required_docs_file: "data/required_docs.txt"
guards:
  numeric_verbatim: true
  deterministic_numeric_comparison: true
